<!DOCTYPE html>
<html lang="fr">
<head>
<script>
/* Marie2.0 autonome : appelle directement Groq (gratuit, clé personnelle). Aucune dépendance à Claude. */
const API='https://api.groq.com/openai/v1/chat/completions',MODELS={quick:'llama-3.1-8b-instant',default:'llama-3.3-70b-versatile'};
const OAI_API='https://api.openai.com/v1/chat/completions';
const OAI_MODELS=['gpt-6-astra','gpt-4.1','gpt-4o','gpt-4o-mini'];
function isOAI(m){return !!(m&&OAI_MODELS.includes(m))}
function getOAIKey(){try{return localStorage.getItem('m2-oai-key')||''}catch(e){return''}}
window.claude={use:async n=>n==='sample'?llm:null};
function getKey(){let k='';try{k=localStorage.getItem('m2-key')||''}catch(e){}return k}
function showKey(msg){const o=document.getElementById('kz');if(!o)return;document.getElementById('ki').value=getKey()||'';document.getElementById('ko').value=getOAIKey()||'';o.style.display='grid';document.getElementById('kmsg').textContent=msg||'';setTimeout(()=>document.getElementById('ki').focus(),50)}
addEventListener('DOMContentLoaded',()=>{
 const o=document.createElement('div');o.id='kz';
 o.style.cssText='position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(10,8,30,.6);padding:16px';
 o.innerHTML='<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px"><b style="font-size:18px">Clés API</b><span style="color:var(--mute);font-size:14px"><b>Groq</b> (gratuit) — console.groq.com › API Keys</span><input id="ki" placeholder="gsk_..." autocomplete="off" autocapitalize="off" spellcheck="false" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit"><span style="color:var(--mute);font-size:14px;margin-top:4px"><b>OpenAI</b> (pour GPT-6 Astra) — platform.openai.com › API keys</span><input id="ko" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit"><span id="kmsg" style="color:var(--acc2);font-size:13px"></span><div style="display:flex;gap:8px;justify-content:flex-end"><button id="kc" type="button" class="ib">Fermer</button><button id="ks" type="button" class="ib" style="background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;font-weight:600">Enregistrer</button></div></div>';
 document.body.appendChild(o);
 document.getElementById('kc').onclick=()=>{o.style.display='none'};
 document.getElementById('ks').onclick=()=>{const v=document.getElementById('ki').value.trim(),vo=document.getElementById('ko').value.trim();
  if(!v&&!vo){document.getElementById('kmsg').textContent='Collez au moins une clé.';return}
  try{if(v)localStorage.setItem('m2-key',v);if(vo)localStorage.setItem('m2-oai-key',vo)}catch(e){}
  document.getElementById('ki').value='';document.getElementById('ko').value='';o.style.display='none'};
 const b=document.createElement('button');b.className='ib';b.type='button';b.textContent='Clé';b.onclick=()=>showKey('');
 const th=document.getElementById('th');if(th)th.before(b);
 if(!getKey())showKey('');
});
let _models=null;
async function getModels(key){
 if(_models)return _models;
 const base=[MODELS.default,MODELS.quick];
 try{const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key}});const j=await r.json();
  const ids=(j.data||[]).map(m=>m.id).filter(id=>!/whisper|guard|tts|playai|orpheus|embed|distil/i.test(id));
  const pref=base.filter(p=>ids.includes(p));_models=[...pref,...ids.filter(x=>!pref.includes(x))];
  if(!_models.length)_models=base}catch(e){_models=base}
 return _models}
window.m2Models=async()=>{const k=getKey();return k?await getModels(k):[]};
const toURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function llm(input,o={}){
 const turns=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({...m}));
 const key=getKey();if(!key){showKey('');throw{code:'nokey'}}
 const _msel=o.model||PREF.model||'';
 if(isOAI(_msel)){
  const _ok=getOAIKey();if(!_ok){showKey('Ajoutez votre clé OpenAI (champ du bas) pour utiliser GPT-6 Astra.');throw{code:'nokey'}}
  let _r;try{_r=await fetch(OAI_API,{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+_ok},body:JSON.stringify({model:_msel,messages:turns.map(m=>({role:m.role,content:m.content})),stream:true,...(typeof o.temperature==='number'?{temperature:o.temperature}:{})})})}
  catch(e){if(e&&e.name==='AbortError')throw{code:'aborted'};throw{code:'net',detail:String(e&&e.message||e)}}
  if(_r.status===401){try{localStorage.removeItem('m2-oai-key')}catch(e){}showKey('Clé OpenAI refusée. Collez-en une nouvelle.');throw{code:'badkey'}}
  if(_r.status===429)throw{code:'rate_limited'};
  if(!_r.ok){let _t='';try{_t=(await _r.text()).slice(0,220)}catch(e){}throw{code:'x',detail:_r.status+' '+_t}}
  const _rd=_r.body.getReader(),_dc=new TextDecoder();let _buf='',_txt='',_rc='',_wr=false;
  try{for(;;){const{done,value}=await _rd.read();if(done)break;_buf+=_dc.decode(value,{stream:true});let _i;
   while((_i=_buf.indexOf('\n'))>=0){const _l=_buf.slice(0,_i).trim();_buf=_buf.slice(_i+1);if(!_l.startsWith('data:'))continue;const _d=_l.slice(5).trim();if(_d==='[DONE]')continue;
   try{const _j=JSON.parse(_d),_ch=_j.choices&&_j.choices[0];const _rcx=_ch&&_ch.delta&&_ch.delta.reasoning_content;if(_rcx)_rc+=_rcx;
   const _t2=_ch&&_ch.delta&&_ch.delta.content;if(_t2){if(_rc&&!_wr){_txt='<think>'+_rc+'</think>'+_txt;_wr=true}_txt+=_t2;if(o.onText)o.onText({text:_txt,delta:_t2})}}catch(e){}}}}
  catch(e){if(e&&e.name==='AbortError')return{text:_txt,truncated:true,aborted:true};throw{code:'net',detail:String(e&&e.message||e)}}
  if(_rc&&!_wr)_txt='<think>'+_rc+'</think>'+_txt;
  return{text:_txt,truncated:false};
 }
 const all=await getModels(key);
 let imgs=null;
 if(o.images&&o.images.length){try{imgs=await Promise.all(o.images.map(toURL))}catch(e){throw{code:'image_rejected'}}}
 const lastU=t=>{for(let i=t.length-1;i>=0;i--)if(t[i].role==='user')return i;return -1};
 const withImg=()=>{const a=turns.map(m=>({...m})),k=lastU(a);a[k].content=[{type:'text',text:a[k].content},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))];return a};
 const noImg=()=>{const a=turns.map(m=>({...m})),k=lastU(a);a[k].content+="\n[Une image est jointe mais ce modèle ne peut pas la voir : dis-le et demande à l'utilisateur de la décrire.]";return a};
 const first=o.model&&all.includes(o.model)?[o.model]:o.modelTier==='quick'&&all.includes(MODELS.quick)?[MODELS.quick]:[];
 const base=[...first,...all.filter(x=>!first.includes(x))].slice(0,6);
 const vis=all.filter(x=>/vision|llama-4|scout|maverick/i.test(x)).slice(0,2);
 const tries=[...(imgs?vis.map(m=>({m,img:true})):[]),...base.map(m=>({m,img:false}))];
 let r,sawRate=false;
 for(const a of tries){
  const body={model:a.m,messages:a.img?withImg():imgs?noImg():turns,stream:true};
  if(typeof o.temperature==='number')body.temperature=o.temperature;
  try{r=await fetch(API,{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)})}
  catch(e){if(e&&e.name==='AbortError')throw{code:'aborted'};throw{code:'net',detail:String(e&&e.message||e)}}
  if(r.status===429)sawRate=true;
  if(r.status!==429&&r.status!==400&&r.status!==404)break;
 }
 if(sawRate&&(r.status===429||r.status===400||r.status===404))throw{code:'rate_limited'};
 if(r.status===401){try{localStorage.removeItem('m2-key')}catch(e){}showKey('Clé refusée. Collez-en une nouvelle.');throw{code:'badkey'}}
 if(r.status===429)throw{code:'rate_limited'};
 if(!r.ok){let t='';try{t=(await r.text()).slice(0,220)}catch(e){}throw{code:'x',detail:r.status+' '+t}}
 const rd=r.body.getReader(),dc=new TextDecoder();let buf='',text='',reasoning='',wrappedR=false;
 try{for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
  while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);
   if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
   try{const j=JSON.parse(d),ch=j.choices&&j.choices[0];
    const rc=ch&&ch.delta&&ch.delta.reasoning_content;if(rc&&typeof rc==='string'){reasoning+=rc}
    const t=ch&&ch.delta&&ch.delta.content;if(t){if(reasoning&&!wrappedR){text='<think>'+reasoning+'</think>'+text;wrappedR=true}text+=t;if(o.onText)o.onText({text,delta:t})}}catch(e){}}}}
 catch(e){if(e&&e.name==='AbortError')return {text,truncated:true,aborted:true};throw{code:'net',detail:String(e&&e.message||e)}}
 if(reasoning&&!wrappedR&&text==='')text='<think>'+reasoning+'</think>';
 else if(reasoning&&!wrappedR)text='<think>'+reasoning+'</think>'+text;
 return {text,truncated:false};
}
llm.limits=async()=>({});
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marie2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#f5f3fc;--surface:#fff;--ink:#1c1933;--mute:#716d8c;--line:#e4e0f4;--acc:#6a4df0;--acc2:#ff74a8;--acc3:#4cc9f0;--me:#1c1933;--meink:#fff;--code:#17142e;--glow:rgba(106,77,240,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c1d;--surface:#181530;--ink:#ece9fb;--mute:#9a96b8;--line:#2a2650;--me:#6a4df0;--code:#0a0816;--glow:rgba(106,77,240,.28)}}
:root[data-theme="dark"]{--bg:#0e0c1d;--surface:#181530;--ink:#ece9fb;--mute:#9a96b8;--line:#2a2650;--me:#6a4df0;--code:#0a0816;--glow:rgba(106,77,240,.28)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg) radial-gradient(70% 45% at 50% 0,var(--glow),transparent) no-repeat;color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.orb{--s:30px;width:var(--s);height:var(--s);flex:none;border-radius:50%;position:relative;background:conic-gradient(from 0deg,var(--acc),var(--acc2),var(--acc3),var(--acc));animation:spin 9s linear infinite;box-shadow:0 0 calc(var(--s)*.5) var(--glow)}
.orb::after{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.15) 55%,transparent 70%)}
.orb.think{animation-duration:1.6s}
@keyframes spin{to{transform:rotate(360deg)}}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px)}
.id{flex:1;min-width:0;line-height:1.2}

.ib:hover{border-color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{text-align:center;padding:28px 0 6px;display:flex;flex-direction:column;align-items:center;gap:10px}

.b pre{position:relative;margin:.5em 0;background:var(--code);color:#e8e6fb;border-radius:12px;padding:30px 14px 12px;overflow-x:auto}

@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
footer{padding:8px 12px 10px}

.bar:focus-within{border-color:var(--acc)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;padding:8px 0;max-height:140px;line-height:1.4}
textarea::placeholder{color:var(--mute)}
#send{width:40px;height:40px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;flex:none}

.note{text-align:center;color:var(--mute);font-size:11.5px;margin:6px 0 0}
@media (max-width:420px){.chips{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.a .b{box-shadow:0 8px 24px -18px var(--acc)}

<script>
const $=s=>document.querySelector(s),log=$('#log'),W=$('#w'),q=$('#q'),send=$('#send'),hd=$('#hd');
const THINK_INST=" Avant chaque réponse, raisonne brièvement (2 à 4 phrases) entre balises <think> et </think>. Exemple : <think>Je vérifie ce que demande l\'utilisateur et comment répondre au mieux.</think> Puis donne ta réponse.";
const SYS0="Tu es Marie2.0, un assistant IA utile, clair et concis. Ton créateur est Mouhamed Rassoul Kane. Si on te demande qui tu es ou qui t'a créé, réponds que tu es Marie2.0, créée par Mouhamed Rassoul Kane. Réponds dans la langue de l'utilisateur. Tu peux utiliser du markdown simple (gras, listes, code).\n\n";
const IDEAS=["Explique-moi l'informatique quantique simplement","Écris un court poème sur la mer","Aide-moi à planifier ma semaine","Donne-moi une idée de petit business"];
let hist=[],sample=null,busy=false,NAME='',curAC=null;function stop(){if(curAC)curAC.abort()}
const SYS=()=>SYS0.trim()+(PREF.think!==false?THINK_INST:'')+" "+(PERS[PREF.persona]?PERS[PREF.persona][1]+" ":"")+(PREF.about?"À savoir sur l'utilisateur : "+PREF.about+" ":"")+(WHO()?WHO().sys:NAME?"L'utilisateur s'appelle "+NAME+". Appelle-le par son prénom de temps en temps, naturellement. ":"")+"\n\n";
function saveName(v){NAME=v;try{v?localStorage.setItem('m2-name',v):localStorage.removeItem('m2-name')}catch(e){}}
function setName(v){saveName(v);if(!W.querySelector('.row'))welcome()}
try{NAME=localStorage.getItem('m2-name')||''}catch(e){}
claude.use("user").then(u=>u?u.me():null).then(me=>{const n=me&&me.name&&me.name.trim().split(' ')[0];if(n&&!NAME){NAME=n;if(!W.querySelector('.row'))welcome()}}).catch(()=>{});
claude.use("sample").then(s=>{sample=s;if(s&&s.limits)s.limits().then(c=>{if(c&&c.images){$('#at').hidden=false;$('#fi').accept=c.images.mediaTypes.join(',')}}).catch(()=>{})}).catch(()=>{});
try{const t=localStorage.getItem('m2-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('m2-theme',d.dataset.theme)}catch(e){}};
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){
 const bl=[];
 t=esc(t).replace(/```\w*\n?([\s\S]*?)(```|$)/g,(m,c)=>{bl.push(c.replace(/\n$/,''));return '\u0000'+(bl.length-1)+'\u0000'});
 t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
 const out=[];let list=null;
 const close=()=>{if(list){out.push('</'+list+'>');list=null}};
 let tb=[];const flush=()=>{if(!tb.length)return;close();const R=tb.map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));tb=[];
  const sep=R.length>1&&R[1].every(c=>/^:?-{2,}:?$/.test(c)),al=sep?R[1].map(c=>/^:-+:$/.test(c)?'center':/-:$/.test(c)?'right':'left'):[];
  const cell=(g,c,i)=>'<'+g+(al[i]?' style="text-align:'+al[i]+'"':'')+'>'+c+'</'+g+'>';
  let h='<div class="tw"><table>';if(sep)h+='<thead><tr>'+R[0].map((c,i)=>cell('th',c,i)).join('')+'</tr></thead>';
  h+='<tbody>'+R.slice(sep?2:0).map(r=>'<tr>'+r.map((c,i)=>cell('td',c,i)).join('')+'</tr>').join('')+'</tbody></table></div>';out.push(h)};
 t.split('\n').forEach(l=>{if(/^\s*\|/.test(l)){tb.push(l);return}flush();
  let m;
  if(/^\u0000\d+\u0000$/.test(l.trim())){close();out.push(l.trim())}
  else if(m=l.match(/^\s*[-*] (.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+m[1]+'</li>')}
  else if(m=l.match(/^\s*\d+[.)] (.*)/)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+m[1]+'</li>')}
  else{close();if(m=l.match(/^#{1,3} (.*)/))out.push('<h4>'+m[1]+'</h4>');else if(l.trim())out.push('<p>'+l+'</p>')}
 });
 flush();close();
 return out.join('').replace(/\u0000(\d+)\u0000/g,(m,i)=>'<pre><button class="cp" type="button">Copier</button><code>'+bl[i]+'</code></pre>');
}
async function copy(t,btn,label){
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}
 btn.textContent='Copié';setTimeout(()=>btn.textContent=label,1400);
}
W.addEventListener('click',e=>{
 const c=e.target.closest('.cp');if(c){copy(c.nextElementSibling.textContent,c,'Copier');return}
 const m=e.target.closest('.mc');if(m){copy(m.closest('.col').querySelector('.b')._raw||'',m,'Copier')}
});
function welcome(){
 const h=new Date().getHours(),g=(h>=18||h<5)?'Bonsoir':'Bonjour',w=WHO(),k=!!(w||NAME);
 const nm=w?w.hi:NAME,line=w?w.line:'Je suis Marie2.0, ravie de vous retrouver. Que puis-je faire pour vous ?';
 W.innerHTML='<div class="hero"><div class="orb"></div><h1>'+g+(k?', '+esc(nm):'')+'</h1><p>'+(k?esc(line):'Je suis Marie2.0. Comment dois-je vous appeler ? Vous pouvez aussi entrer votre code.')+'</p>'+(k?'<button class="lk" type="button" id="nn">Ce n\'est pas vous ?</button>':'<div class="nm"><input id="ni" placeholder="Prénom ou code" maxlength="30" autocomplete="off" aria-label="Prénom ou code"><button type="button" id="ns">Valider</button></div>')+'<div class="chips">'+IDEAS.map(i=>'<button class="chip" type="button">'+esc(i)+'</button>').join('')+'</div></div>';
 W.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));
 const ns=$('#ns');if(ns){const go=()=>{const v=$('#ni').value.trim();if(!v)return;const c=v.toLowerCase();if(CODES[c])setCode(c);else setName(v[0].toUpperCase()+v.slice(1))};ns.onclick=go;$('#ni').onkeydown=e=>{if(e.key==='Enter')go()}}
 const nn=$('#nn');if(nn)nn.onclick=()=>{PREF.code='';savePrefs();saveName('');welcome()};
}
function scroll(){log.scrollTop=log.scrollHeight}
function addUser(t){const r=document.createElement('div');r.className='row u';const b=document.createElement('div');b.className='b';b.textContent=t;r.appendChild(b);W.appendChild(r);scroll()}
function addBot(){
 const r=document.createElement('div');r.className='row a';
 r.innerHTML='<div class="orb think" style="--s:30px"></div><div class="col"><div class="b"><span class="dots"><i></i><i></i><i></i></span></div><div class="tools"></div></div>';
 W.appendChild(r);scroll();return r;
}
function setBusy(v){busy=v;hd.classList.toggle('think',v);if(v){send._h=send.innerHTML;send.textContent='■ Arrêter';send.style.width='auto';send.style.padding='0 14px'}else if(send._h){send.innerHTML=send._h;send.style.width='';send.style.padding='';send._h=null}sync()}
function sync(){send.disabled=busy?false:(!q.value.trim()&&!imgFile)}
async function ask(t){
 t=t.trim();if((!t&&!imgFile)||busy)return;
 if(!t)t='Décris cette image.';
 const cd=t.toLowerCase();if(CODES[cd]){q.value='';q.style.height='auto';sync();setCode(cd);return}
 const mm=t.match(/(?:je m'appelle|je me nomme|mon (?:pr[ée]nom|nom) est|appelle[- ]moi|moi c'est)\s+([A-Za-zÀ-ÿ'-]{2,30})/i);
 if(mm)saveName(mm[1][0].toUpperCase()+mm[1].slice(1));
 const hero=W.querySelector('.hero');if(hero)hero.remove();
 q.value='';q.style.height='auto';const im=imgFile;clearImg();
 addUser(t+(im?'\n[image jointe]':''));hist.push({role:'user',content:t+(im?' [image jointe]':'')});
 if(!cur)cur={id:'c'+Date.now(),title:t.slice(0,48),created:Date.now()};
 gen(im?[im]:null);
}
function fmtS(s){s=Math.round(s||0);if(s<60){s=Math.max(1,s);return s+' seconde'+(s>1?'s':'')}const m=Math.floor(s/60),r=s%60;return m+' min'+(r?' '+r+' s':'')}
function splitThink(t){
 const oa=t.search(/<think(\s[^>]*)?\s*>/i);if(oa<0)return{has:false,open:false,think:'',answer:t};
 const oe=t.indexOf('>',oa)+1;
 const ce=t.search(/<\/think\s*>/i);
 if(ce<0)return{has:true,open:true,think:t.slice(oe),answer:t.slice(0,oa)};
 return{has:true,open:false,think:t.slice(oe,ce),answer:(t.slice(0,oa)+t.slice(ce+8)).replace(/^\s+/,'')}}
function setLab(tk){const o=tk._o,l=tk.firstChild,tp=tk.children[1];
 if(o.run)l.innerHTML='En train de réfléchir...<span class="dd"><i></i><i></i><i></i></span>';
 else if(o.cut)l.textContent='Réflexion interrompue';
 else l.textContent='A réfléchi pendant '+fmtS(o.secs)+(tp.hidden?' ▾':' ▴')}
function paint(b,raw,o={}){
 const p=splitThink(raw);
 if(!p.has||PREF.think===false){b.innerHTML=md(p.answer);return}
 let tk=b.querySelector('.tk');
 if(!tk){b.innerHTML='<div class="tk"><button type="button" class="tl" aria-expanded="false"></button><div class="tp" hidden></div></div><div class="an"></div>';
  tk=b.querySelector('.tk');const l=tk.firstChild;l.onclick=()=>{const t=tk.children[1];t.hidden=!t.hidden;l.setAttribute('aria-expanded',String(!t.hidden));setLab(tk)}}
 tk._o={run:p.open&&!o.cut,cut:p.open&&!!o.cut,secs:o.secs};
 tk.children[1].textContent=p.think.trim();setLab(tk);
 b.querySelector('.an').innerHTML=md(p.answer)}
async function gen(images){
 const ac=new AbortController();curAC=ac;let secs=null;const t0=Date.now();const r=addBot(),b=r.querySelector('.b'),orb=r.querySelector('.orb');setBusy(true);refreshTools();
 try{
  if(!sample)sample=await claude.use("sample");
  if(!sample)throw{code:'none'};
  const turns=[{role:'system',content:SYS()},...hist.slice(-(PREF.ctx||24)).map(m=>({role:m.role,content:m.content}))];
  const o={cache:false,onText:({text})=>{const q0=splitThink(text);if(q0.has&&!q0.open&&secs==null)secs=(Date.now()-t0)/1000;paint(b,text,{secs});scroll()}};o.signal=ac.signal;o.temperature=+PREF.temp;if(PREF.model)o.model=PREF.model;if(images)o.images=images;
  const res=await sample(turns,o);
  const pt=splitThink(res.text);let ans=pt.answer;
   if(res.aborted){if(!ans.trim()&&!pt.has)throw{code:'aborted'};ans=ans.trim()?ans+'\n\n⏹ interrompue':'⏹ interrompue'}
   if(pt.has&&secs==null)secs=(Date.now()-t0)/1000;
   b._raw=ans;paint(b,pt.has?'<think>'+pt.think+'</think>'+ans:ans,{secs,cut:!!res.aborted&&pt.open});
   hist.push(Object.assign({role:'assistant',content:ans},pt.has?{thinking:pt.think.trim(),thinkSecs:secs}:{}));
  cur.updated=Date.now();cur.messages=hist.slice();saveChat(cur);
  r.querySelector('.tools').innerHTML=TOOLS();
  if(PREF.auto)speak(pt.answer,r.querySelector('.tt'));
  if(hist.length===2)autoTitle();
 }catch(err){
  const u=hist.pop();if(u&&u.role==='user'){q.value=u.content.replace(/ \[image jointe\]$/,'');q.style.height='auto';const us=W.querySelectorAll('.row.u');if(us.length)us[us.length-1].remove()}
  if(!hist.length)cur=null;
  b.classList.add('err');
  const c=err&&err.code;
  b.textContent=c==='aborted'?"Génération interrompue.":c==='nokey'?"Il faut une clé API Groq. Collez-la dans la fenêtre qui s'affiche, puis renvoyez votre message.":c==='badkey'?"Clé API refusée. Collez une nouvelle clé dans la fenêtre qui s'affiche.":c==='net'?"Connexion à Groq impossible ("+(navigator.onLine?'en ligne':'hors ligne')+", "+location.protocol+", "+(err.detail||'')+"). Si vous êtes en ligne, ouvrez le fichier dans Chrome ou Safari (pas dans une appli) et désactivez VPN ou bloqueur de pub.":c==='not_granted'?"Autorisation refusée. Rechargez la page et acceptez pour discuter.":c==='rate_limited'?"Trop de messages envoyés. Patientez un instant avant de réessayer.":(c==='image_rejected'||c==='images_unavailable')?"Cette image n'a pas été acceptée (format ou taille).":"Marie2.0 n'a pas pu répondre"+(err&&err.detail?' ['+err.detail+']':'. Réessayez dans un instant.');
 }
 orb.classList.remove('think');setBusy(false);refreshTools();q.focus();scroll();
}
$('#nw').onclick=newChat;
send.onclick=()=>busy?stop():ask(q.value);
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px';sync()});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();ask(q.value)}});
let cur=null,dbc=null;
const dbReady=(async()=>{try{const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);const id=u&&await u.id();if(d&&id)dbc=d.collection("data/users/"+id)}catch(e){}})();
const lsAll=()=>{try{return JSON.parse(localStorage.getItem('m2-chats')||'[]')}catch(e){return[]}};
const lsPut=a=>{try{localStorage.setItem('m2-chats',JSON.stringify(a))}catch(e){}};
async function saveChat(c){
 await dbReady;
 const rec={title:c.title,created:c.created,updated:c.updated,messages:c.messages,pin:!!c.pin};
 const a=lsAll().filter(x=>x.id!==c.id);a.unshift({id:c.id,...rec});lsPut(a.slice(0,60));
 if(dbc)try{await dbc.doc(c.id).set(rec)}catch(e){}
}
async function delChat(id){
 await dbReady;lsPut(lsAll().filter(x=>x.id!==id));
 if(dbc)try{await dbc.doc(id).delete()}catch(e){}
}
async function listChats(){
 await dbReady;const m=new Map();lsAll().forEach(x=>m.set(x.id,x));
 if(dbc)try{(await dbc.get()).docs.forEach(d=>{const x={id:d.id,...d.data()},o=m.get(x.id);if(!o||(x.updated||0)>=(o.updated||0))m.set(x.id,x)})}catch(e){}
 return Array.from(m.values()).filter(x=>x.messages&&x.messages.length).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.updated||0)-(a.updated||0));
}
function addBotStatic(t,m){
 const r=addBot(),b=r.querySelector('.b');r.querySelector('.orb').classList.remove('think');
 b._raw=t;if(m&&m.thinking)paint(b,'<think>'+m.thinking+'</think>'+t,{secs:m.thinkSecs});else b.innerHTML=md(t);r.querySelector('.tools').innerHTML=TOOLS();
}
function openDr(){$('#dr').classList.add('open');$('#bk').hidden=false;renderList()}
function closeDr(){$('#dr').classList.remove('open');$('#bk').hidden=true}
function newChat(){if(busy)return;hist=[];cur=null;welcome();closeDr()}
function openChat(c){
 if(busy)return;hist=c.messages.slice();cur={id:c.id,title:c.title,created:c.created,updated:c.updated,pin:c.pin};
 W.innerHTML='';hist.forEach(m=>m.role==='user'?addUser(m.content):addBotStatic(m.content,m));closeDr();scroll();refreshTools();
}
async function renderList(){
 const all=await listChats(),f=$('#sr').value.trim().toLowerCase(),box=$('#ls');
 const items=all.filter(c=>!f||(c.title||'').toLowerCase().includes(f)||c.messages.some(m=>m.content.toLowerCase().includes(f)));
 box.textContent='';
 if(!items.length){const p=document.createElement('p');p.className='gl';p.textContent=f?'Aucun résultat.':'Aucune discussion pour le moment.';box.appendChild(p);return}
 const d0=new Date();d0.setHours(0,0,0,0);const D=864e5,t0=d0.getTime();let last='';
 items.forEach(c=>{
  const u=c.updated||0,g=c.pin?'Épinglées':u>=t0?"Aujourd'hui":u>=t0-D?'Hier':u>=t0-7*D?'7 derniers jours':'Plus ancien';
  if(g!==last){const h=document.createElement('p');h.className='gl';h.textContent=g;box.appendChild(h);last=g}
  const it=document.createElement('div');it.className='it'+(cur&&cur.id===c.id?' on':'');
  const sp=document.createElement('span');sp.textContent=c.title||'Discussion';
  const em=document.createElement('em');em.textContent=new Date(u).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const pn=document.createElement('button');pn.type='button';pn.textContent=c.pin?'★':'☆';pn.setAttribute('aria-label','Épingler');pn.onclick=async e=>{e.stopPropagation();c.pin=!c.pin;if(cur&&cur.id===c.id)cur.pin=c.pin;await saveChat(c);renderList()};
  const rn=document.createElement('button');rn.type='button';rn.textContent='✎';rn.setAttribute('aria-label','Renommer');
   rn.onclick=e=>{e.stopPropagation();const inp=document.createElement('input');inp.value=c.title||'';inp.style.cssText='flex:1;min-width:0;font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)';it.replaceChild(inp,sp);inp.focus();inp.select();let dn=false;
    const ok=async()=>{if(dn)return;dn=true;const v=inp.value.trim().slice(0,60);if(v){c.title=v;if(cur&&cur.id===c.id)cur.title=v;await saveChat(c)}renderList()};
    inp.onkeydown=ev=>{if(ev.key==='Enter')ok();if(ev.key==='Escape'){dn=true;renderList()}};inp.onblur=ok;inp.onclick=ev=>ev.stopPropagation()};
   const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Supprimer');
  x.onclick=async e=>{e.stopPropagation();await delChat(c.id);if(cur&&cur.id===c.id){hist=[];cur=null;welcome()}renderList()};
  it.onclick=()=>openChat(c);it.append(sp,em,rn,pn,x);box.appendChild(it);
 });
}
function dl(n,t,ty){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();a.remove()}catch(e){navigator.clipboard&&navigator.clipboard.writeText(t)}}
$('#xm').onclick=()=>{if(!hist.length)return;dl('discussion-marie.md','# '+((cur&&cur.title)||'Discussion')+'\n\n'+hist.map(m=>'**'+(m.role==='user'?'Vous':'Marie2.0')+'**\n\n'+m.content).join('\n\n---\n\n'),'text/markdown')};
$('#xj').onclick=async()=>{dl('marie2-export.json',JSON.stringify({prefs:PREF,chats:await listChats()},null,1),'application/json')};
$('#at').hidden=false;$('#fi').accept='image/*';
$('#hs').onclick=openDr;$('#dx').onclick=closeDr;$('#bk').onclick=closeDr;$('#nc').onclick=newChat;
$('#sr').addEventListener('input',renderList);
addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});

const CODES={
 mk01:{hi:"Mouhamed",line:"Je suis Marie2.0. Quel plaisir de retrouver Mouhamed Rassoul Kane, mon créateur.",sys:"L'utilisateur est Mouhamed Rassoul Kane, ton créateur. Accueille-le avec respect et chaleur, et appelle-le Mouhamed. "},
 md01:{hi:"Marie",line:"Je suis Marie2.0. Quel honneur d'accueillir Marie, l'épouse de Mouhamed Rassoul Kane, mon créateur.",sys:"L'utilisatrice s'appelle Marie, elle est l'épouse de Mouhamed Rassoul Kane, ton créateur. Accueille-la avec respect et chaleur, et appelle-la Marie. "}
};
const WHO=()=>CODES[(PREF.code||'').toLowerCase()]||null;
function setCode(c){
 PREF.code=c;savePrefs();
 if(!W.querySelector('.row')){welcome();return}
 addBotStatic(CODES[c].line);const t=W.querySelectorAll('.row.a .tools');t[t.length-1].innerHTML='';refreshTools();
}
const PERS={std:["Standard",""],ami:["Amie","Parle comme une amie proche : chaleureuse, détendue, encourageante."],prof:["Prof","Explique comme un excellent professeur : étape par étape, avec des exemples."],code:["Codeuse","Tu es experte en programmation : réponses précises, code dans des blocs, explications brèves."],bref:["Concise","Réponds en 2 ou 3 phrases maximum."]};
const PREF={persona:'std',about:'',auto:false,code:'',temp:0.7,ctx:24,model:'',think:true};let imgFile=null;
const TOOLS=()=>'<button class="mc" type="button">Copier</button>'+(window.speechSynthesis?'<button class="tt" type="button">Écouter</button>':'');
try{Object.assign(PREF,JSON.parse(localStorage.getItem('m2-prefs')||'{}'))}catch(e){}
dbReady.then(async()=>{if(dbc)try{const d=await dbc.doc('prefs').get();if(d.exists){Object.assign(PREF,d.data());if(!W.querySelector('.row'))welcome()}}catch(e){}});
async function savePrefs(){try{localStorage.setItem('m2-prefs',JSON.stringify(PREF))}catch(e){}await dbReady;if(dbc)try{await dbc.doc('prefs').set(PREF)}catch(e){}}
function refreshTools(){
 W.querySelectorAll('.rg,.ed').forEach(x=>x.remove());
 const rows=W.querySelectorAll('.row.a .tools'),t=rows[rows.length-1];
 if(t&&t.firstChild&&!busy)t.insertAdjacentHTML('beforeend','<button class="rg" type="button">Refaire</button><button class="ed" type="button">Modifier</button>');
}
let speaking=null;
const plain=t=>t.replace(/```[\s\S]*?```/g,' (code) ').replace(/[*#`_]/g,'');
function speak(t,btn){
 const ss=window.speechSynthesis;if(!ss)return;
 const was=speaking;
 if(ss.speaking||ss.pending){ss.cancel();document.querySelectorAll('.tt').forEach(x=>x.textContent='Écouter');speaking=null;if(was===btn)return}
 const u=new SpeechSynthesisUtterance(plain(t));u.lang='fr-FR';
 const v=ss.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
 u.onend=u.onerror=()=>{if(btn)btn.textContent='Écouter';if(speaking===btn)speaking=null};
 if(btn)btn.textContent='Stop';speaking=btn;ss.speak(u);
}
W.addEventListener('click',e=>{
 if(busy)return;
 const tt=e.target.closest('.tt');if(tt){speak(tt.closest('.col').querySelector('.b')._raw||'',tt);return}
 if(e.target.closest('.rg')){hist.pop();const a=W.querySelectorAll('.row.a');a[a.length-1].remove();gen(null);return}
 if(e.target.closest('.ed')){
  const u=hist[hist.length-2];if(!u)return;
  hist.length-=2;W.querySelectorAll('.row.a').forEach((x,i,a)=>{if(i===a.length-1)x.remove()});
  const us=W.querySelectorAll('.row.u');if(us.length)us[us.length-1].remove();
  q.value=u.content.replace(/ \[image jointe\]$/,'');q.dispatchEvent(new Event('input'));q.focus();
  if(!hist.length){cur=null;welcome()}else{cur.messages=hist.slice();saveChat(cur);refreshTools()}
 }
});
async function autoTitle(){
 const c=cur,a=hist[0].content.slice(0,300),b=hist[1].content.slice(0,300);
 try{
  const r=await sample("Donne un titre de 2 à 5 mots, sans guillemets ni ponctuation finale, pour cette discussion :\n"+a+"\n"+b,{modelTier:'quick',cache:false});
  const t=r.text.trim().replace(/^["«\s]+|["»\s.]+$/g,'').slice(0,50);
  if(t&&c){c.title=t;if(c.messages)saveChat(c)}
 }catch(e){}
}
function clearImg(){imgFile=null;$('#fi').value='';$('#pv').hidden=true;$('#pv').textContent='';sync()}
$('#at').onclick=()=>$('#fi').click();
$('#fi').onchange=()=>{
 const f=$('#fi').files[0];if(!f)return;imgFile=f;
 const pv=$('#pv'),im=document.createElement('img'),x=document.createElement('button');
 im.src=URL.createObjectURL(f);im.alt='Image jointe';x.type='button';x.textContent='×';x.setAttribute('aria-label','Retirer');x.onclick=clearImg;
 pv.textContent='';pv.append(im,x);pv.hidden=false;sync();
};
function openSt(){
 $('#pers').innerHTML=Object.entries(PERS).map(([k,v])=>'<button type="button" class="pl'+(PREF.persona===k?' on':'')+'" data-k="'+k+'">'+v[0]+'</button>').join('');
 $('#ab').value=PREF.about;$('#au').checked=PREF.auto;$('#ex').textContent='Exporter la discussion (.txt)';$('#md').hidden=false;fillSt();
}
async function fillSt(){const tp=$('#tp'),cx=$('#cx'),mo=$('#mo');$('#sk').checked=PREF.think!==false;tp.value=PREF.temp;$('#tv').textContent=(+PREF.temp).toFixed(1);cx.value=PREF.ctx;$('#cv').textContent=PREF.ctx;
 tp.oninput=()=>{$('#tv').textContent=(+tp.value).toFixed(1)};cx.oninput=()=>{$('#cv').textContent=cx.value};
 const L=window.m2Models?await window.m2Models():[];const _okey=getOAIKey();
 const _oaiOpts=_okey?OAI_MODELS.map(m=>'<option value="'+m+'">'+m+'</option>').join(''):'<option disabled>── Ajoutez une clé OpenAI pour GPT-6 Astra ──</option>';
 mo.innerHTML='<option value="">Automatique (Groq)</option><optgroup label="Groq">'+L.map(m=>'<option value="'+m+'">'+m+'</option>').join('')+'</optgroup><optgroup label="OpenAI — GPT-6 Astra">'+_oaiOpts+'</optgroup>';
 mo.value=PREF.model||''}
$('#pers').addEventListener('click',e=>{const b=e.target.closest('.pl');if(!b)return;$('#pers').querySelectorAll('.pl').forEach(x=>x.classList.toggle('on',x===b))});
$('#gr').onclick=()=>{closeDr();openSt()};
$('#mcl').onclick=()=>{$('#md').hidden=true};
$('#msv').onclick=()=>{const on=$('#pers').querySelector('.pl.on');PREF.persona=on?on.dataset.k:'std';PREF.about=$('#ab').value.trim().slice(0,400);PREF.auto=$('#au').checked;PREF.think=$('#sk').checked;PREF.temp=+$('#tp').value;PREF.ctx=+$('#cx').value;PREF.model=$('#mo').value;savePrefs();$('#md').hidden=true};
$('#ex').onclick=async()=>{
 const btn=$('#ex');if(!hist.length){btn.textContent='Rien à exporter';return}
 const txt=(cur&&cur.title?cur.title+'\n\n':'')+hist.map(m=>(m.role==='user'?'Vous : ':'Marie2.0 : ')+m.content).join('\n\n');
 try{const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:'discussion-marie.txt',data:txt});btn.textContent='Exportée'}
 catch(e){await copy(txt,btn,'Exporter la discussion (.txt)');btn.textContent='Copiée dans le presse-papiers'}
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('#mic');
if(SR){mic.hidden=false;let rec=null,heard='';
 mic.onclick=()=>{
  if(rec){rec.stop();return}
  if(busy)return;
  rec=new SR();rec.lang='fr-FR';rec.interimResults=true;heard='';
  mic.classList.add('rec');q.placeholder='Je vous écoute…';
  rec.onresult=e=>{heard=Array.from(e.results).map(r=>r[0].transcript).join(' ');q.value=heard;sync()};
  rec.onerror=e=>{q.placeholder=e.error==='not-allowed'?'Micro refusé. Autorisez-le puis réessayez.':'Écrivez à Marie2.0'};
  rec.onend=()=>{rec=null;mic.classList.remove('rec');if(q.placeholder==='Je vous écoute…')q.placeholder='Écrivez à Marie2.0';if(heard.trim())ask(heard)};
  rec.start();
 }}
welcome();
